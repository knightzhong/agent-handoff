[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff"
version = "0.1.0"
description = "Preserve coding-agent context and hand work off between LLM backends."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "knightzhong"}]
keywords = ["coding-agent", "llm", "mcp", "handoff", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.9,<2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
handoff = "agent_handoff.cli:main"
handoff-mcp = "agent_handoff.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
